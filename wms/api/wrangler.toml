name = "nitya-stock-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One Worker serves both the staff app (static files from wms/app/dist, built
# first with `npm run build` in wms/app) and the API under /api/*. Deployed
# 15 September 2026 to https://nitya-stock-api.coleisha.workers.dev. Once the
# domain's DNS is on Cloudflare, add admin.nityastones.co.uk as a custom domain
# on this Worker (Settings → Domains & Routes); no route line is needed.
[assets]
directory = "../app/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nitya-stock"
database_id = "2c9a08c2-37cc-4ca2-8960-4fb4280ccc1a"
migrations_dir = "migrations"

[vars]
# The Cloudflare Access team domain and the application's audience tag, from
# Zero Trust → Access → Applications. Empty in local dev: DEV_USER is used instead.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Local development only: the email the Worker treats as signed in. Never set in production.
DEV_USER = ""
# Comma-separated origins allowed to call the public routes (the site).
PUBLIC_ORIGINS = "https://nityastones.co.uk,https://www.nityastones.co.uk,https://admin.nityastones.co.uk"

[env.dev.vars]
DEV_USER = "fee@example.test"
PUBLIC_ORIGINS = "http://localhost:5173,http://localhost:8788"

# Environments do not inherit bindings; the dev environment needs the database too.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "nitya-stock"
database_id = "2c9a08c2-37cc-4ca2-8960-4fb4280ccc1a"
migrations_dir = "migrations"
