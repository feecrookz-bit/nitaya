name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web

      # The site is published encrypted behind a password gate
      # (scripts/protect.mjs) using the SITE_PASSWORD repository secret.
      # Without the secret the deploy stops rather than publishing it open;
      # set PUBLIC_PREVIEW=true as a repository variable to allow that.
      - name: Build
        working-directory: web
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PUBLIC_PREVIEW: ${{ vars.PUBLIC_PREVIEW }}
        run: |
          mkdir -p publish
          if [ -n "$SITE_PASSWORD" ]; then
            SINGLE=1 npm run build
            node scripts/protect.mjs dist-single/index.html publish/index.html "$SITE_PASSWORD"
            cp public/favicon.png public/apple-touch-icon.png publish/
          elif [ "$PUBLIC_PREVIEW" = "true" ]; then
            BASE_PATH=/nitaya/ npm run build
            cp -r dist/. publish/
          else
            echo "::error::No SITE_PASSWORD secret set and PUBLIC_PREVIEW is not 'true' — refusing to publish the site open. Add the secret in Settings → Secrets and variables → Actions."
            exit 1
          fi
          cp publish/index.html publish/404.html
          touch publish/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/publish
          force_orphan: true
