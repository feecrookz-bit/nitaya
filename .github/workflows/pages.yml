name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web

      # The site is published encrypted behind a password gate
      # (scripts/protect.mjs) using the SITE_PASSWORD repository secret.
      # Without the secret the deploy stops rather than publishing it open.
      # The repository variable PUBLIC_PREVIEW=true publishes it open on purpose
      # (with a noindex tag), whether or not the secret exists.
      - name: Build
        working-directory: web
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PUBLIC_PREVIEW: ${{ vars.PUBLIC_PREVIEW }}
        run: |
          mkdir -p publish
          if [ "$PUBLIC_PREVIEW" = "true" ]; then
            # Open preview (owner's decision, September 2026): no gate, but kept out of search engines.
            BASE_PATH=/nitaya/ npm run build
            cp -r dist/. publish/
            sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow" />|' publish/index.html
          elif [ -n "$SITE_PASSWORD" ]; then
            # Markup, script and stylesheet are folded into one file and
            # encrypted; images, fonts and lazy chunks stay as hashed files
            # under assets/ so the unlock is light on a phone.
            BASE_PATH=/nitaya/ npm run build
            node scripts/inline.mjs dist dist/page.html
            node scripts/protect.mjs dist/page.html publish/index.html "$SITE_PASSWORD"
            rm dist/page.html dist/index.html
            cp -r dist/. publish/
          else
            echo "::error::No SITE_PASSWORD secret set and PUBLIC_PREVIEW is not 'true' — refusing to publish the site open. Add the secret in Settings → Secrets and variables → Actions."
            exit 1
          fi
          cp publish/index.html publish/404.html
          touch publish/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/publish
          force_orphan: true
